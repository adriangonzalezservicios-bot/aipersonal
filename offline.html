<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>OmniSynth AI — Sin conexión</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 560px; text-align: center; padding: 32px; border: 1px solid #1e293b; border-radius: 24px; background: #0f172a; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { color: #94a3b8; line-height: 1.6; }
      button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 18px; background: #4f46e5; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>OmniSynth está sin conexión</h1>
      <p>La aplicación quedó instalada y su interfaz está disponible, pero las funciones de IA necesitan conexión a Internet.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
